name: Publish signed app updates

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag to retry
        required: true
        type: string
      desktop_only:
        description: Reuse Android assets already uploaded to the draft
        required: false
        default: false
        type: boolean

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Validate release version
        run: node -e "const fs=require('fs'); const ref=process.env.RELEASE_TAG; if(!/^v\d+\.\d+\.\d+$/.test(ref)) throw new Error('发布 Tag 必须是 vX.Y.Z'); const tag=ref.slice(1); const app=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json')).version; const pkg=JSON.parse(fs.readFileSync('package.json')).version; if(tag!==app||tag!==pkg) throw new Error('Tag、tauri.conf.json 与 package.json 版本必须一致')"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true || { echo "$RELEASE_TAG 已经发布，拒绝覆盖"; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "mianshi $RELEASE_TAG" --notes "包含最新功能改进和问题修复。"
          fi

  publish-desktop:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles app,dmg
          - platform: windows-latest
            target: ''
            args: --bundles nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Add Rust target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}
      - run: npm ci
      - name: Configure and validate updater signing
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MIANSHI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: node scripts/configure-updater.mjs
      - uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MIANSHI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          MIANSHI_UPDATE_ENDPOINT: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
          MIANSHI_RELEASE_URL: https://github.com/${{ github.repository }}/releases/latest
          APPLE_SIGNING_IDENTITY: '-'
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: mianshi ${{ env.RELEASE_TAG }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  publish-android:
    needs: create-release
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.desktop_only) }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-linux-android
      - name: Install Android NDK
        run: sdkmanager 'ndk;27.0.12077973'
      - run: npm ci
      - name: Restore Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo 'ANDROID_KEYSTORE_BASE64 is missing'; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mianshi-release.jks"
      - name: Build signed Android APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/mianshi-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MIANSHI_ANDROID_UPDATE_ENDPOINT: https://github.com/${{ github.repository }}/releases/latest/download/android-latest.json
          MIANSHI_RELEASE_URL: https://github.com/${{ github.repository }}/releases/latest
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo 'ANDROID_KEYSTORE_PASSWORD is missing'; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo 'ANDROID_KEY_ALIAS is missing'; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo 'ANDROID_KEY_PASSWORD is missing'; exit 1; }
          npm run android:release:arm64
      - name: Upload APK and Android update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          APK_SOURCE="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK_SOURCE" || { echo 'Release APK not found'; exit 1; }
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER" || { echo 'apksigner not found'; exit 1; }
          "$APKSIGNER" verify --verbose --print-certs "$APK_SOURCE"
          APK_NAME="mianshi-${VERSION}-android-arm64.apk"
          cp "$APK_SOURCE" "$APK_NAME"
          export VERSION APK_NAME
          node <<'NODE'
          const fs = require('fs');
          const repo = process.env.GITHUB_REPOSITORY;
          const tag = process.env.RELEASE_TAG;
          fs.writeFileSync('android-latest.json', JSON.stringify({
            version: process.env.VERSION,
            notes: '包含最新功能改进和问题修复。',
            downloadUrl: `https://github.com/${repo}/releases/download/${tag}/${process.env.APK_NAME}`,
          }, null, 2));
          NODE
          gh release upload "$RELEASE_TAG" "$APK_NAME" android-latest.json --clobber

  publish-release:
    needs: [publish-desktop, publish-android]
    if: >-
      ${{
        always() &&
        needs.publish-desktop.result == 'success' &&
        (
          needs.publish-android.result == 'success' ||
          (github.event_name == 'workflow_dispatch' && inputs.desktop_only && needs.publish-android.result == 'skipped')
        )
      }}
    runs-on: ubuntu-22.04
    steps:
      - name: Validate retained Android assets
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.desktop_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          grep -qx 'android-latest.json' <<<"$ASSETS"
          grep -Eq '^mianshi-[0-9]+\.[0-9]+\.[0-9]+-android-arm64\.apk$' <<<"$ASSETS"
      - name: Publish only after every artifact succeeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
